id: '1742846170666'
alias: 'Notification: Jellyseerr'
description: Comprehensive Jellyseerr notifications for requests, approvals, availability,
  and issues
triggers:
- webhook_id: -AdVpVNVr-35VVtidXy5vH-up
  allowed_methods:
  - POST
  - PUT
  local_only: false
  trigger: webhook
conditions: []
actions:
- variables:
    event_type: '{{ trigger.json.notification_type | default("Unknown Event") }}'
    media_title: '{{ trigger.json.subject | default("Unknown Title") }}'
    username: '{{ trigger.json.request.requestedBy_username | default("Unknown User")
      }}'
    media_type: '{{ trigger.json.media.media_type | default("Unknown Type") }}'
    media_status: '{{ trigger.json.media.status | default("Unknown Status") }}'
    media_image: '{{ trigger.json.image | default("") }}'
- data:
    title: '{% if event_type == "MEDIA_PENDING" %}New Request: {{ media_title }} {%
      elif event_type in ["MEDIA_APPROVED", "MEDIA_AUTO_APPROVED"] %}Approved: {{
      media_title }} {% elif event_type == "MEDIA_AVAILABLE" %}Now Available: {{ media_title
      }} {% elif event_type == "ISSUE_CREATED" %}New Issue: {{ media_title }} {% elif
      event_type == "ISSUE_COMMENT" %}New Comment: {{ media_title }} {% elif event_type
      == "ISSUE_RESOLVED" %}Issue Resolved: {{ media_title }} {% else %}{{ event_type
      }}: {{ media_title }} {% endif %}'
    message: "{% if event_type.startswith(\"MEDIA_\") %}\n  {{ username }} {{ event_type\
      \ | replace(\"MEDIA_\", \"\") | lower }} {{ media_type | lower }} \"{{ media_title\
      \ }}\"\n  Status: {{ media_status | title }}\n{% elif event_type.startswith(\"\
      ISSUE_\") %}\n  {{ trigger.json.issue.reportedBy_username | default(username)\
      \ }} {{ event_type | replace(\"ISSUE_\", \"\") | lower }} an issue for \"{{\
      \ media_title }}\"\n  {% if trigger.json.comment.comment_message %}\n  Comment:\
      \ {{ trigger.json.comment.comment_message }}\n  {% endif %}\n{% else %}\n  {{\
      \ trigger.json.message }}\n{% endif %}"
    data:
      image: '{{ media_image }}'
      actions:
      - action: URI
        title: View in Jellyseerr
        uri: "{% if media_type == \"movie\" %}\n  https://request.mattvandenberg.com/movie/{{\
          \ trigger.json.media.tmdbId }}\n{% elif media_type == \"tv\" %}\n  https://request.mattvandenberg.com/tv/{{\
          \ trigger.json.media.tmdbId }}\n{% else %}\n  https://request.mattvandenberg.com\n\
          {% endif %}"
  action: notify.mobile_app_matthews_iphone
- alias: Start Live Activity in Searching state
  choose:
  - conditions:
    - condition: template
      value_template: '{{ event_type in [''MEDIA_APPROVED'', ''MEDIA_AUTO_APPROVED'',
        ''MEDIA_PENDING''] }}'
    sequence:
    - action: input_text.set_value
      target:
        entity_id: input_text.arr_media_title
      data:
        value: '{{ media_title[:255] }}'
    - action: input_text.set_value
      target:
        entity_id: input_text.arr_download_id
      data:
        value: ''
    - action: notify.mobile_app_matthews_iphone
      data:
        title: '{{ media_title }}'
        message: Searching for a release
        data:
          tag: media_download
          live_update: true
          critical_text: Searching
          notification_icon: mdi:magnify
          notification_icon_color: '#A78BFA'
          background_color: '#0B1120'
mode: parallel
max: 10
enabled: true
